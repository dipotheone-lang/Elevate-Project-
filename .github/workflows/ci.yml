name: PROJECT ELEVATE CI

# United Brothers Co. — runs the PROJECT ELEVATE test suite and a smoke run
# of the full pipeline on every push and pull request.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: PROJECT_ELEVATE_SYSTEM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile all modules
        run: python -m py_compile *.py

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Smoke-run the full pipeline (A -> Z)
        run: python run_pipeline.py --out /tmp/elevate_ci_out
